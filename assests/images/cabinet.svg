<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-label="A weathered wooden arcade cabinet" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- floor shadow -->
  <ellipse cx="160" cy="426" rx="120" ry="10" fill="#000" opacity="0.35"/>

  <!-- cabinet body -->
  <path d="M40 60 H280 V420 H40 Z" fill="#5a3a1f"/>
  <path d="M40 60 H64 V420 H40 Z" fill="#3f2713"/>
  <path d="M256 60 H280 V420 H256 Z" fill="#3f2713"/>
  <!-- wood grain -->
  <g stroke="#3f2713" stroke-width="2" opacity="0.6">
    <path d="M70 90 V410"/><path d="M110 70 V410"/><path d="M210 70 V410"/><path d="M250 90 V410"/>
  </g>

  <!-- marquee -->
  <rect x="52" y="22" width="216" height="52" rx="4" fill="#2a1a0f" stroke="#c9953c" stroke-width="4"/>
  <rect x="62" y="30" width="196" height="36" fill="#b5472a"/>
  <g fill="#f2e2c0">
    <rect x="76" y="42" width="8" height="12"/><rect x="88" y="42" width="8" height="12"/>
    <rect x="108" y="42" width="24" height="6"/><rect x="108" y="54" width="24" height="6"/>
    <rect x="144" y="42" width="8" height="18"/><rect x="156" y="42" width="8" height="18"/>
    <rect x="176" y="42" width="24" height="6"/><rect x="176" y="54" width="24" height="6"/>
    <rect x="212" y="42" width="8" height="18"/><rect x="224" y="42" width="20" height="6"/>
  </g>
  <!-- marquee bulbs -->
  <g fill="#e0a030">
    <circle cx="66" cy="26" r="2.5"/><circle cx="106" cy="26" r="2.5"/><circle cx="146" cy="26" r="2.5"/>
    <circle cx="186" cy="26" r="2.5"/><circle cx="226" cy="26" r="2.5"/><circle cx="254" cy="26" r="2.5"/>
  </g>

  <!-- screen bezel + screen -->
  <rect x="62" y="86" width="196" height="150" rx="10" fill="#1a110a" stroke="#c9953c" stroke-width="3"/>
  <rect class="screen" x="74" y="98" width="172" height="126" rx="6" fill="#16302e"/>
  <!-- pixel snake and food on the screen -->
  <g fill="#8fd3a4">
    <rect x="94"  y="150" width="14" height="14"/><rect x="108" y="150" width="14" height="14"/>
    <rect x="122" y="150" width="14" height="14"/><rect x="136" y="150" width="14" height="14"/>
    <rect x="136" y="136" width="14" height="14"/><rect x="136" y="122" width="14" height="14"/>
    <rect x="150" y="122" width="14" height="14"/>
  </g>
  <rect x="196" y="176" width="14" height="14" fill="#e0a030"/>
  <!-- scanlines -->
  <g stroke="#000" opacity="0.18">
    <path d="M74 108H246"/><path d="M74 118H246"/><path d="M74 128H246"/><path d="M74 138H246"/>
    <path d="M74 148H246"/><path d="M74 158H246"/><path d="M74 168H246"/><path d="M74 178H246"/>
    <path d="M74 188H246"/><path d="M74 198H246"/><path d="M74 208H246"/><path d="M74 218H246"/>
  </g>

  <!-- control deck -->
  <path d="M52 262 H268 L282 300 H38 Z" fill="#3f2713" stroke="#c9953c" stroke-width="2"/>
  <!-- joystick -->
  <circle cx="110" cy="282" r="12" fill="#2a1a0f"/>
  <rect x="107" y="260" width="6" height="22" fill="#9a9a9a"/>
  <circle cx="110" cy="258" r="9" fill="#b5472a"/>
  <!-- buttons -->
  <circle cx="190" cy="282" r="9" fill="#e0a030" stroke="#2a1a0f" stroke-width="2"/>
  <circle cx="216" cy="276" r="9" fill="#3f7f78" stroke="#2a1a0f" stroke-width="2"/>
  <circle cx="242" cy="282" r="9" fill="#b5472a" stroke="#2a1a0f" stroke-width="2"/>

  <!-- coin door -->
  <rect x="126" y="334" width="68" height="62" rx="4" fill="#2a1a0f" stroke="#c9953c" stroke-width="3"/>
  <rect x="150" y="346" width="20" height="4" fill="#000"/>
  <rect x="140" y="360" width="40" height="22" rx="2" fill="#b5472a"/>
  <rect x="148" y="368" width="24" height="6" fill="#f2e2c0"/>

  <!-- nails -->
  <g fill="#c9953c">
    <circle cx="52" cy="100" r="2.5"/><circle cx="52" cy="380" r="2.5"/>
    <circle cx="268" cy="100" r="2.5"/><circle cx="268" cy="380" r="2.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
